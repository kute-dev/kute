# Gateway API's own CRDs, trimmed to what §23b reads. Installed without any
# Gateway controller, for the same reason the Flux and Argo CRDs are
# (52-flux-crds.yaml): nothing reconciles these, so the hand-written
# status.parents in 59-gateway-objects.yaml — one route accepted, one
# refused — stays exactly as written. A real controller would either attach
# both or refuse both within seconds, and §23b's whole point is the two
# states side by side ("a valid-but-unattached route is the #1 Gateway API
# footgun").
#
# No status subresource on purpose: the objects set status through a plain
# apply, which a status subresource would drop.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gateways.gateway.networking.k8s.io
spec:
  group: gateway.networking.k8s.io
  scope: Namespaced
  names:
    plural: gateways
    singular: gateway
    kind: Gateway
    listKind: GatewayList
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Class
          type: string
          jsonPath: .spec.gatewayClassName
        - name: Programmed
          type: string
          jsonPath: .status.conditions[?(@.type=="Programmed")].status
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
# HTTPRoute is the one discovered kind with a bespoke Descriptor
# (resources.httpRouteDescriptor): its ATTACHED column is inserted ahead of
# the CRD's own printer columns, and its health comes from status.parents'
# Accepted condition rather than the generic Ready read. The declared
# printer column below is there so the insertion order is observable.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: httproutes.gateway.networking.k8s.io
spec:
  group: gateway.networking.k8s.io
  scope: Namespaced
  names:
    plural: httproutes
    singular: httproute
    kind: HTTPRoute
    listKind: HTTPRouteList
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Hostnames
          type: string
          jsonPath: .spec.hostnames
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
