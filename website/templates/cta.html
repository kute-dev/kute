{{define "cta"}}<section class="cta">
  <div class="wrap">
    <div class="cta-panel reveal">
      <h2>Install kute.</h2>
      <p>One binary, no cluster-side install. Or run <code>kute --demo</code> first and try it against a fake cluster.</p>
      <div class="code-block">
        <div><span class="prompt">$</span><span class="cmd">curl</span> <span class="flag">-fsSL</span> https://kute.dev/install.sh | sh</div>
        <button class="copy-btn" data-copy="curl -fsSL https://kute.dev/install.sh | sh" aria-label="Copy command">
          {{template "copyicon"}}
        </button>
      </div>
      <div class="install-ctas">
        <a class="btn btn-primary btn-sm" href="/install.html">All install options</a>
        <a class="btn btn-ghost" href="https://github.com/kute-dev/kute" target="_blank" rel="noopener">View on GitHub</a>
      </div>
    </div>
  </div>
</section>{{end}}
