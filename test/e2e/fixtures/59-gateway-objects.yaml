# §23b's objects: one Gateway with two listeners, one HTTPRoute its status
# says was accepted, and one it says was refused.
#
# Nothing reconciles any of this (58-gateway-crds.yaml installs the CRDs with
# no controller), so every status field below is the permanent reading — the
# same arrangement the Flux and Argo fixtures make, and for the same reason:
# accepted-vs-refused is only assertable if both stay put.
#
# The backends reuse 40-routing.yaml's Services deliberately: web and api
# exist, checkout does not, so the routing table has a resolved backend and
# an unresolvable one on the same screen. That contrast is the only way to
# tell a live backend lookup from a rendered string.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: kute-e2e
spec:
  gatewayClassName: kute-e2e-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    - name: https
      protocol: HTTPS
      port: 443
      hostname: shop.kute-e2e.test
status:
  listeners:
    - name: http
      attachedRoutes: 1
    - name: https
      attachedRoutes: 0
---
# The accepted route: two rules, so the table shows a weighted split stacked
# under one match and a second match with a header clause. checkout has no
# Service, which is what makes its row the broken one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-route
  namespace: kute-e2e
spec:
  parentRefs:
    - name: public
      sectionName: http
  hostnames:
    - shop.kute-e2e.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
          weight: 90
        - name: api
          port: 8080
          weight: 10
    - matches:
        - path:
            type: Exact
            value: /internal
          headers:
            - name: x-env
              value: stage
      backendRefs:
        - name: checkout
          port: 8080
status:
  parents:
    - parentRef:
        name: public
        sectionName: http
      controllerName: kute.dev/e2e
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          message: Route is attached to the listener
          lastTransitionTime: "2026-01-01T00:00:00Z"
---
# §23b's "#1 Gateway API footgun": a route that is perfectly valid and
# attached to nothing. Its ATTACHED cell has to say so on the list, verbatim
# message included, rather than reading as an ordinary healthy row.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stale-route
  namespace: kute-e2e
spec:
  parentRefs:
    - name: public
      sectionName: https
  hostnames:
    - admin.kute-e2e.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 80
status:
  parents:
    - parentRef:
        name: public
        sectionName: https
      controllerName: kute.dev/e2e
      conditions:
        - type: Accepted
          status: "False"
          reason: NoMatchingListenerHostname
          message: no listener hostname matches admin.kute-e2e.test
          lastTransitionTime: "2026-01-01T00:00:00Z"
