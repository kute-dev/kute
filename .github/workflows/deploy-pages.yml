name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "cmd/site/**"
      - "docs/assets/incident-walkthrough-all-namespaces.gif"
      - "docs/assets/namespace-palette-demo.gif"
      - "docs/assets/goto-palette-demo.gif"
      - "docs/assets/demo-everyday-actions.gif"
      - "docs/assets/demo-routing-table.gif"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Render the site
        # The pages are generated from website/{pages,templates,site.json}:
        # the nav, head, footer and install panel exist once each rather than
        # copy-pasted into every page. Output lands in website/dist/.
        run: go run ./cmd/site
      - name: Stage site with demo GIFs
        # demo.html references these under assets/ — kept only in docs/assets/
        # (the recording pipeline's output) to avoid committing duplicate
        # binary copies, and merged in here at deploy time instead.
        run: |
          mkdir -p _site/assets
          cp -r website/. _site/
          rm -rf _site/pages _site/templates _site/dist _site/site.json
          cp -r website/dist/. _site/
          cp docs/assets/incident-walkthrough-all-namespaces.gif docs/assets/namespace-palette-demo.gif docs/assets/goto-palette-demo.gif docs/assets/demo-everyday-actions.gif docs/assets/demo-routing-table.gif _site/assets/
      - name: Cache-bust demo GIFs
        # GitHub Pages doesn't let us set Cache-Control, so a re-recorded gif
        # keeping the same filename would otherwise stay stuck in visitors'
        # browser caches. Tag each reference with the commit SHA so every
        # deploy that touches a gif forces a fresh fetch.
        run: sed -i -E "s/(\.gif)\"/\1?v=${GITHUB_SHA}\"/g" _site/demo.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
