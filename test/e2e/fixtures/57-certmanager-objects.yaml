# cert-manager objects with hand-written status. No controller runs, so every
# state below is permanent — which is the point: §35a needs a chain that is
# genuinely stuck at its deepest hop and one that is cleanly issued, both on
# a cluster with no ACME server and no CA, which a real cert-manager would
# collapse into "issuer not found" within a second.
#
# Two chains, chosen to cover the branches §35a actually forks on:
#
#   web-tls       ACME, four hops deep, failing at the Challenge — the case
#                 the failure banner exists for. Its target Secret is
#                 deliberately absent (refs · missing) and its issuerRef is a
#                 *ClusterIssuer*, which certchain resolves with a "" (cluster
#                 -wide) namespace.
#   internal-tls  CA, two hops, Ready. Its Secret exists and its issuerRef is
#                 a namespaced *Issuer*, the other side of that same branch.
#
# Everything lives in kute-e2e, same as the Flux and Argo fixtures.
---
# The ClusterIssuer web-tls points at. Cluster-scoped on purpose: certchain's
# resolveIssuerRef reads Issuer with the object's own namespace and
# ClusterIssuer with "", and only a genuinely cluster-scoped CRD tells those
# two apart.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-e2e
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: e2e@kute.dev
    privateKeySecretRef:
      name: letsencrypt-e2e-account-key
status:
  conditions:
    - type: Ready
      status: "True"
      reason: ACMEAccountRegistered
      message: The ACME account was registered with the ACME server
      lastTransitionTime: "2026-01-05T09:00:00Z"
---
# The namespaced Issuer internal-tls points at.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: internal-ca
  namespace: kute-e2e
spec:
  ca:
    secretName: internal-ca-keypair
status:
  conditions:
    - type: Ready
      status: "True"
      reason: KeyPairVerified
      message: Signing CA verified
      lastTransitionTime: "2026-01-05T09:00:00Z"
---
# ── web-tls: the failing ACME chain ──────────────────────────────────────
#
# Ready=False with reason=Issuing is *not* by itself a failure — cert-manager
# reports exactly this while an issuance is merely in flight, which is why
# §35a's certNode classes it Warn and looks deeper for the real story. The
# banner has to come from the Challenge, four hops down.
#
# spec.secretName names a Secret that does not exist anywhere in this
# fixture set, so the refs strip reads "missing" — the honest state for a
# certificate that has never successfully issued.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-tls
  namespace: kute-e2e
spec:
  secretName: web-tls
  dnsNames:
    - web.kute-e2e.test
  issuerRef:
    name: letsencrypt-e2e
    kind: ClusterIssuer
    group: cert-manager.io
status:
  conditions:
    - type: Ready
      status: "False"
      reason: Issuing
      message: Issuing certificate as Secret does not exist
      lastTransitionTime: "2026-08-01T10:00:00Z"
---
# Approved but not Ready: ordinary progress, so this hop is Warn too.
#
# No ownerReferences here, even though the whole chain is an ownership walk:
# the API server rejects an ownerReference with an empty uid, and a
# *fabricated* uid is worse than none — the garbage collector resolves owners
# by uid, finds nothing, and deletes the child out from under the fixture.
# scripts/e2e-cluster.sh patches each ownerReference in after apply, with the
# parent's real uid. certchain's own ownedBy matches on Kind+Name, so the uid
# is the cluster's requirement rather than the screen's.
apiVersion: cert-manager.io/v1
kind: CertificateRequest
metadata:
  name: web-tls-1
  namespace: kute-e2e
spec:
  request: e2e-placeholder-csr
  issuerRef:
    name: letsencrypt-e2e
    kind: ClusterIssuer
    group: cert-manager.io
status:
  conditions:
    - type: Approved
      status: "True"
      reason: cert-manager.io
      message: Certificate request has been approved by cert-manager.io
      lastTransitionTime: "2026-08-01T10:00:01Z"
    - type: Ready
      status: "False"
      reason: Pending
      message: Waiting on certificate issuance from order kute-e2e/web-tls-1-2748
      lastTransitionTime: "2026-08-01T10:00:01Z"
---
# status.state=pending with *no* status.reason: cert-manager only populates
# reason to explain something going wrong, so a bare pending is ordinary
# progress (Warn). Keeping this hop healthy is what forces the banner to come
# from the Challenge below rather than from the first thing that isn't green.
apiVersion: acme.cert-manager.io/v1
kind: Order
metadata:
  name: web-tls-1-2748
  namespace: kute-e2e
spec:
  request: e2e-placeholder-csr
  dnsNames:
    - web.kute-e2e.test
  issuerRef:
    name: letsencrypt-e2e
    kind: ClusterIssuer
    group: cert-manager.io
status:
  state: pending
---
# The deepest hop and the only genuine failure: state=invalid. §35a promotes
# this into the top band ("challenge failed"), with this reason as the message
# and the Order above named as its parent.
apiVersion: acme.cert-manager.io/v1
kind: Challenge
metadata:
  name: web-tls-1-2748-0
  namespace: kute-e2e
spec:
  type: http-01
  dnsName: web.kute-e2e.test
  url: https://acme-staging-v02.api.letsencrypt.org/acme/chall-v3/e2e/0
  issuerRef:
    name: letsencrypt-e2e
    kind: ClusterIssuer
    group: cert-manager.io
status:
  state: invalid
  reason: 'propagation check failed: NXDOMAIN looking up A record for web.kute-e2e.test'
  presented: false
  processing: false
---
# ── internal-tls: the healthy CA chain ───────────────────────────────────
#
# Two hops, both Ready, no Order/Challenge at all — a CA issuer has no ACME
# stage, which is why §35a must render a short chain without inventing the
# missing hops.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-tls
  namespace: kute-e2e
spec:
  secretName: internal-tls
  dnsNames:
    - internal.kute-e2e.test
  issuerRef:
    name: internal-ca
    kind: Issuer
    group: cert-manager.io
status:
  # §35b's EXPIRES/RENEWAL columns read these two directly. Far-future so the
  # fixture does not rot into an "expired" reading partway through the
  # project's life.
  notAfter: "2035-01-05T09:00:00Z"
  renewalTime: "2034-11-06T09:00:00Z"
  revision: 1
  conditions:
    - type: Ready
      status: "True"
      reason: Ready
      message: Certificate is up to date and has not expired
      lastTransitionTime: "2026-01-05T09:00:00Z"
---
apiVersion: cert-manager.io/v1
kind: CertificateRequest
metadata:
  name: internal-tls-1
  namespace: kute-e2e
spec:
  request: e2e-placeholder-csr
  issuerRef:
    name: internal-ca
    kind: Issuer
    group: cert-manager.io
status:
  conditions:
    - type: Approved
      status: "True"
      reason: cert-manager.io
      message: Certificate request has been approved by cert-manager.io
      lastTransitionTime: "2026-01-05T09:00:00Z"
    - type: Ready
      status: "True"
      reason: Issued
      message: Certificate fetched from issuer successfully
      lastTransitionTime: "2026-01-05T09:00:01Z"
---
# The target Secret internal-tls resolves to. Its existence is the whole
# assertion — §35a's refs strip reports existence for a Secret and nothing
# more, since a Secret has no Ready concept.
apiVersion: v1
kind: Secret
metadata:
  name: internal-tls
  namespace: kute-e2e
type: kubernetes.io/tls
