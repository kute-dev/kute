# The load-bearing fixture for "CRD support is data, not code": a kind kute
# has never heard of, declaring its own printer columns and a Ready-style
# condition. Discovery has to turn this into a kind-registry entry with those
# columns and that status derivation, with no per-CRD layout code anywhere.
#
# No status subresource on purpose — the Widgets in 51-widgets.yaml set
# status.conditions through a plain apply, which a status subresource would
# silently drop.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.kute.dev
spec:
  group: kute.dev
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
    listKind: WidgetList
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Size
          type: string
          jsonPath: .spec.size
        - name: Colour
          type: string
          jsonPath: .spec.colour
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
                colour:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
