<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Inter, sans-serif">
  <defs>
    <radialGradient id="glow" cx="72%" cy="6%" r="62%">
      <stop offset="0%" stop-color="#5ddba4" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#5ddba4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#5ddba4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0b10"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="80" y="118" fill="#5ddba4" font-size="44" font-weight="bold">❯</text>
  <text x="122" y="118" fill="#f0f0fa" font-size="44" font-weight="bold">kute</text>

  <!-- headline -->
  <text x="80" y="240" fill="#f0f0fa" font-size="76" font-weight="bold">Your cluster,</text>
  <text x="80" y="330" fill="#f0f0fa" font-size="76" font-weight="bold">in plain sight.</text>

  <text x="80" y="392" fill="#9a9ab2" font-size="30">The incident console for Kubernetes</text>

  <!-- terminal card -->
  <rect x="80" y="440" width="1040" height="120" rx="10" fill="#111119" stroke="#26263a"/>
  <circle cx="112" cy="470" r="6" fill="#ef6a6a"/>
  <circle cx="134" cy="470" r="6" fill="#e8c74a"/>
  <circle cx="156" cy="470" r="6" fill="#34d17b"/>
  <text x="112" y="518" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#8f8fa4">$</text>
  <text x="140" y="518" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#f0f0fa">kute --demo</text>
  <text x="330" y="518" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#8f8fa4">no cluster needed</text>
  <text x="1090" y="518" font-family="DejaVu Sans Mono, monospace" font-size="25" fill="#34d17b" text-anchor="end">● ready</text>
</svg>
