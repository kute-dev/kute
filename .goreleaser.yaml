version: 2

project_name: kute

builds:
  - main: ./cmd/kute
    binary: kute
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# Signed with a keyless cosign identity bound to the release workflow's OIDC
# token, so the certificate says which workflow at which tag produced the
# artifact — that is the part checksums.txt cannot carry, since it travels
# over the same channel as the file it describes.
#
# Two entries rather than one `artifacts: all`: that would also sign every
# SBOM, doubling the asset count for a file nobody verifies on its own. The
# archives are signed so verification is one command against the file the
# user actually downloaded; checksums.txt is signed for anyone who prefers
# to verify the manifest and hash from it.
signs:
  - id: archives
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: archive
    output: true
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  extra_files:
    - glob: ./.release/changelog.json

# Windows's counterpart to the homebrew cask. Scoop takes the windows zip
# archives as-is, so nothing above changes. `directory: bucket` is not
# optional-looking cosmetics: scoop expects manifests under bucket/, and
# goreleaser defaults to the repository root.
scoops:
  - name: kute
    directory: bucket
    homepage: "https://github.com/kute-dev/kute"
    description: "A TUI Kubernetes console, built with Bubble Tea and Lip Gloss."
    license: "Apache-2.0"
    repository:
      owner: kute-dev
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    commit_author:
      name: kute-release-bot
      email: releases@kute.dev

homebrew_casks:
  - name: kute
    binaries:
      - kute
    homepage: "https://github.com/kute-dev/kute"
    description: "A TUI Kubernetes console, built with Bubble Tea and Lip Gloss."
    license: "Apache-2.0"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "#{staged_path}/kute"]
          end
    caveats: |
      kute is open-source software and is not currently signed with an
      Apple Developer ID. The Homebrew installation removes the macOS
      quarantine attribute from the installed binary.
    repository:
      owner: kute-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: kute-release-bot
      email: releases@kute.dev
