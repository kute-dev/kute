name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "cmd/site/**"
      - "docs/assets/demos/*.mp4"
      - "docs/assets/demos/*.png"
      - "docs/assets/shots/home-*.png"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - name: Render the site
        # The pages are generated from website/{pages,templates,site.json}:
        # the nav, head, footer and install panel exist once each rather than
        # copy-pasted into every page. Output lands in website/dist/.
        run: go run ./cmd/site
      - name: Stage site with demo recordings
        # The home and guide pages reference these under assets/ — kept only
        # in docs/assets/ alongside the tapes they are recorded from, and
        # merged in here at deploy time rather than duplicated under website/.
        # The copy flattens docs/assets/{shots,demos}/ into one assets/ dir,
        # which is why a page URL stays /assets/<name> no matter which of them
        # a file lives in. Regenerate with the recording scripts.
        run: |
          mkdir -p _site/assets
          cp -r website/. _site/
          rm -rf _site/pages _site/templates _site/dist _site/site.json
          cp -r website/dist/. _site/
          cp docs/assets/demos/*.mp4 docs/assets/demos/*.png docs/assets/shots/home-*.png _site/assets/
      - name: Cache-bust demo recordings
        # GitHub Pages doesn't let us set Cache-Control, so a re-recorded clip
        # keeping the same filename would otherwise stay stuck in visitors'
        # browser caches. Tag each reference with the commit SHA so every
        # deploy that touches one forces a fresh fetch. Every page is rewritten
        # rather than a named one: naming the page is how this got missed when
        # the recordings moved off demo.html, and a page with no <video> is a
        # no-op here.
        run: sed -i -E "s/(\.mp4|(home|demo)-[a-z-]+\.png)\"/\1?v=${GITHUB_SHA}\"/g" _site/*.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "./_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
