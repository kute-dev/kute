name: Release
on:
  push:
    tags: ["v*"]
# id-token is what makes the cosign signatures keyless: the job trades this
# token for a short-lived Fulcio certificate naming this workflow and this
# tag, which is the identity `cosign verify-blob --certificate-identity`
# checks against. attestations is for the provenance step below.
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # cosign and syft come from here: .goreleaser.yaml's signs/sboms shell
      # out to both by name, and mise puts them on PATH for later steps.
      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Generate changelog.json
        run: scripts/release-notes.sh "${{ github.ref_name }}"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned because this step now signs things: an unpinned binary
          # decides how the artifacts are produced. Keep in step with
          # ci.yml's goreleaser-check job by hand.
          version: "2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      # The signing step only runs on a tag — no PR has an OIDC identity, so
      # ci.yml's snapshot build passes `--skip=sign` and cannot catch a
      # cosign invocation that no longer parses. Verifying one archive here,
      # with the exact command docs/verifying-releases.md gives users, is
      # what turns that class of breakage into a red release job instead of
      # a release whose signatures nobody can check.
      - name: Verify the signatures we just published
        run: |
          set -euo pipefail
          for file in dist/kute_*_linux_amd64.tar.gz dist/checksums.txt; do
            echo "verifying ${file}"
            cosign verify-blob \
              --certificate-identity-regexp '^https://github\.com/kute-dev/kute/\.github/workflows/release\.yml@refs/tags/' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --bundle "${file}.sigstore.json" \
              "${file}"
          done
      # One attestation over every file checksums.txt lists, so a user can
      # ask GitHub what built an archive (`gh attestation verify`) as well as
      # asking the signature who signed it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/checksums.txt
