# Three restricted identities. The first two prove kute degrades honestly
# when access is missing; the third proves --namespace-scoped turns a
# previously-unusable namespace-only Role into a working session.
#
# kute-restricted and kute-partial's grants are cluster-scoped, and that is
# not an accident: kute's informers list every kind cluster-wide regardless
# of which namespace is selected (the namespace is a filter applied to the
# cache, not to the LIST). A Role bound only in kute-e2e therefore does not
# let kute read pods at all under an *unscoped* launch — the reflector's
# cluster-scope LIST is denied — which is why an earlier version of this
# fixture could not get the app past its connect screen. kute-team is the
# exception: it is a namespaced Role on purpose, because it is only ever
# launched under --namespace-scoped, where the eager Pod cache itself is
# scoped to kute-e2e rather than cluster-wide (see
# test/e2e/scoped_test.go).
---
# kute-restricted may list and get Pods in kute-e2e and nothing else,
# anywhere. Namespace is one of the three eager informers, so this identity is
# refused at *connect*: the app never reaches a resource screen at all. What
# it tests is that the 4c recovery screen names the RBAC denial verbatim
# instead of hanging on a spinner or claiming the cluster is empty.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kute-restricted
  namespace: kute-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kute-restricted
  namespace: kute-e2e
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kute-restricted
  namespace: kute-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kute-restricted
subjects:
  - kind: ServiceAccount
    name: kute-restricted
    namespace: kute-e2e
---
# kute-partial can read exactly the kinds kute needs to connect, plus a couple
# more, and nothing else: no Secrets, no Deployments, no Ingresses. It is the
# identity that exercises the *per-kind* 403 paths, which only exist once the
# app is actually running — a kind that is settled-but-forbidden must not read
# as a cluster with none of them, and must not spin forever either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kute-partial
  namespace: kute-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kute-partial
rules:
  - apiGroups: [""]
    # namespaces/pods/nodes are the three eager informers; configmaps and
    # events give the run at least one lazily-started kind that succeeds, so
    # a failure on Secrets is visibly about Secrets rather than about
    # everything.
    resources: ["namespaces", "pods", "pods/log", "nodes", "configmaps", "events"]
    verbs: ["list", "get", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    # CRD discovery runs at connect for every identity, and a denial there is
    # not a per-kind failure — it is taken as the cluster being unreachable.
    # Granting it keeps this identity's *other* denials isolated to the kinds
    # they are about.
    resources: ["customresourcedefinitions"]
    verbs: ["list", "get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kute-partial
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kute-partial
subjects:
  - kind: ServiceAccount
    name: kute-partial
    namespace: kute-e2e
---
# kute-team is a realistic namespace-bound developer: several kinds of read
# access inside kute-e2e, none of it cluster-scoped. This is the persona
# --namespace-scoped exists for — a Role, never a ClusterRole — and the identity
# test/e2e/scoped_test.go's scoped-mode suite launches under.
# Deliberately no Secrets/Deployments/Ingresses: those are what proves an
# ungranted kind still shows the 403 card honestly under scoped mode too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kute-team
  namespace: kute-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kute-team
  namespace: kute-e2e
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "events"]
    verbs: ["list", "get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kute-team
  namespace: kute-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kute-team
subjects:
  - kind: ServiceAccount
    name: kute-team
    namespace: kute-e2e
---
# The same team identity can read the secondary fixture namespace. Keeping a
# distinct Role in each namespace is intentional: the scoped-cache tests
# exercise a realistic namespace-bound identity, never a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kute-team
  namespace: kute-e2e-b
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "events"]
    verbs: ["list", "get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kute-team
  namespace: kute-e2e-b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kute-team
subjects:
  - kind: ServiceAccount
    name: kute-team
    namespace: kute-e2e
