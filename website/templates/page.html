<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<meta name="description" content="{{.Description}}">
{{if .NoIndex}}<meta name="robots" content="noindex">
{{end}}{{if .Canonical}}<link rel="canonical" href="{{.Canonical}}">
{{end}}<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<link rel="stylesheet" href="/assets/styles.css">
<script>
// Runs before first paint, deliberately blocking and inline. The deferred
// script at end-of-body sets this too, but by then the page has already
// painted, so anyone with a stored light theme saw a dark flash on every
// navigation. Wrapped because localStorage throws outright when site data is
// blocked, and this must never be the thing that stops the page rendering.
try { var t = localStorage.getItem('kute-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<noscript>
<!-- .reveal sections start transparent and are faded in by script; without
     it every one of them stays invisible and the page reads as empty. -->
<style>.reveal { opacity: 1 !important; transform: none !important; }</style>
</noscript>
<meta name="theme-color" content="#5ddba4" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#12855a" media="(prefers-color-scheme: light)">
{{if .Canonical}}<meta property="og:site_name" content="kute">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{.OGTitle}}">
<meta property="og:description" content="{{.OGDescription}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{.Canonical}}">
<meta property="og:image" content="{{$.SiteURL}}assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="kute — your cluster, in plain sight. The incident console for Kubernetes.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{.OGTitle}}">
<meta name="twitter:description" content="{{.TwitterDescription}}">
<meta name="twitter:image" content="{{$.SiteURL}}assets/og-card.png">
{{end}}{{if .StructuredData}}<script type="application/ld+json">
{{.StructuredData}}
</script>
{{end}}</head>
<body class="editorial-page{{if .Home}} home-page{{end}}">
{{if .Home}}<!--
THESIS: kute turns cluster operations into eight answer-first jobs, refusing the generic feature-grid landing page.
OWN-WORLD: quiet paper-like fields, precise green signals, compact controls, and real theme-matched terminal captures.
STORY: understand the incident console, inspect the proof, then run the demo or install one binary.
FIRST VIEWPORT: a left-aligned promise and two actions lead directly into the all-namespace triage screen.
FORM: supplied editorial task explorer; seed key user-provided-redesign.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->{{end}}
<a class="skip-link" href="#main">Skip to content</a>

{{template "nav" .}}

<main id="main">
{{.Body}}
</main>

<footer>
  <div class="wrap">
    <div class="footer-row">
      <div>
        <a href="/index.html" class="footer-brand"><span class="mark">❯</span>kute</a>
        <p class="footer-tag">{{.FooterTag}}</p>
      </div>
      <div class="footer-links">
        <a href="/guide.html">Guide</a>
        <a href="/install.html">Install</a>
        <a href="/verify.html">Verify a download</a>
        <a href="https://github.com/kute-dev/kute" target="_blank" rel="noopener">GitHub</a>
        <a href="https://github.com/kute-dev/kute/issues" target="_blank" rel="noopener">Issues</a>
        <span class="footer-license">Apache License 2.0</span>
      </div>
    </div>
  </div>
</footer>

<script src="/assets/script.js"></script>
</body>
</html>
